<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Gently irregular diagonal line -->
  <path d="M1000 24 Q750 50 500 512 Q250 974 24 1000" stroke="#8B6F4E" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <!-- Angel (top left, scaled up) -->
  <g clip-path="url(#topLeft)">
    <g transform="translate(80,80) scale(7.5)">
      <ellipse cx="32" cy="54" rx="16" ry="6" fill="#EAD7B7"/>
      <circle cx="32" cy="32" r="14" fill="#FFF8E1" stroke="#8B6F4E" stroke-width="2"/>
      <ellipse cx="32" cy="20" rx="10" ry="4" fill="#FFD700" opacity="0.7"/>
      <ellipse cx="18" cy="44" rx="7" ry="4" fill="#B3E5FC" opacity="0.7" transform="rotate(35 18 44)"/>
      <ellipse cx="46" cy="44" rx="7" ry="4" fill="#B3E5FC" opacity="0.7" transform="rotate(-35 46 44)"/>
      <circle cx="32" cy="28" r="2" fill="#8B6F4E"/>
      <circle cx="38" cy="28" r="2" fill="#8B6F4E"/>
      <path d="M28 36 Q32 40 36 36" stroke="#8B6F4E" stroke-width="2" fill="none"/>
    </g>
  </g>
  <!-- Devil (bottom right, scaled up and closer to diagonal) -->
  <g clip-path="url(#bottomRight)">
    <g transform="translate(420,420) scale(7.5)">
      <ellipse cx="32" cy="54" rx="16" ry="6" fill="#EAD7B7"/>
      <circle cx="32" cy="32" r="14" fill="#FFE5E5" stroke="#8B6F4E" stroke-width="2"/>
      <polygon points="24,18 28,10 32,18" fill="#D32F2F"/>
      <polygon points="40,18 36,10 32,18" fill="#D32F2F"/>
      <rect x="50" y="38" width="2" height="14" fill="#D32F2F"/>
      <line x1="51" y1="38" x2="54" y2="34" stroke="#D32F2F" stroke-width="2"/>
      <line x1="51" y1="38" x2="48" y2="34" stroke="#D32F2F" stroke-width="2"/>
      <circle cx="28" cy="28" r="2" fill="#8B6F4E"/>
      <circle cx="36" cy="28" r="2" fill="#8B6F4E"/>
      <path d="M28 36 Q32 32 36 36" stroke="#8B6F4E" stroke-width="2" fill="none"/>
      <path d="M32 46 Q34 48 36 46" stroke="#D32F2F" stroke-width="2" fill="none"/>
    </g>
  </g>
  <defs>
    <clipPath id="topLeft">
      <polygon points="0,0 1024,0 0,1024"/>
    </clipPath>
    <clipPath id="bottomRight">
      <polygon points="1024,0 1024,1024 0,1024"/>
    </clipPath>
  </defs>
</svg>
